<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML 原型状态总览：原始需求</title><style>body{max-width:1080px;margin:40px auto;padding:0 24px;font:16px/1.8 system-ui,sans-serif;color:#203047;background:#fafbfd}h1,h2{line-height:1.4}section{background:white;padding:20px 24px;margin:20px 0;border:1px solid #dce3ec;border-radius:12px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #dce3ec;padding:10px;text-align:left}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef2f6;padding:16px}a{color:#1759b4}code{overflow-wrap:anywhere}@media print{body{margin:0;background:white}section{break-inside:avoid}}</style></head><body><a href="index.html">交付入口</a><h1>HTML 原型状态总览：原始需求</h1><section><h2>用户原文</h2><blockquote>那帮我设计一下HTML原型的状态总览方案，让AI可以直接访问各个页面和弹窗状态，同时保留正常交互流程。</blockquote><h2>问题背景</h2><p>用户指出 Figma 的界面状态可以摊平展示，HTML 则需要先触发事件再读取；怀疑逐次点击、截图和分析导致 AI 读取原型缓慢。该性能原因尚未计时验证。</p><h2>本轮范围</h2><p>设计状态目录、直达入口、可复现初始化、与正常交互共存的方案及验收建议。未授权事项不自动升级为开发任务。本轮不修改原型、技能规范、发布脚本或业务规则，不发布原型。</p></section></body></html>
