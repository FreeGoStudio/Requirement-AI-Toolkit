schema_version: 1
workspace_id: local-workflow-lab
project_id: prototype-lab
repository:
  default_branch: main
applications:
  - id: admin
    name: 管理后台
    root: apps/admin
    build_command: npm run build-storybook --prefix apps/admin
    output: apps/admin/storybook-static
    entry: /settings
    screens:
      - route: /settings
        story_id: admin-application--interactive
      - route: /inventory
        story_id: admin-application--interactive
  - id: pos
    name: POS
    root: apps/pos
    build_command: npm run build-storybook --prefix apps/pos
    output: apps/pos/storybook-static
    entry: /login
    screens:
      - route: /login
        story_id: pos-application--interactive
      - route: /home
        story_id: pos-application--interactive
