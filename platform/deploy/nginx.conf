events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server {
    listen 8080;
    server_tokens off;
    location / {
      # The artifact service checks project permission for every file, restores
      # the original archive on demand, and serves only immutable build paths.
      proxy_pass http://host.docker.internal:3078;
      proxy_set_header Host $host;
      proxy_set_header Cookie $http_cookie;
      proxy_read_timeout 120s;
      proxy_cache off;
    }
  }
}
